inboundShortMessage:
  name: "{{flow_name}}"
  description: Web messaging. Sends the conversation to the digital queue.
  division: "{{division_name}}"
  startUpRef: "/inboundShortMessage/states/state[Initial State_10]"
  defaultLanguage: en-us
  supportedLanguages:
    en-us:
      defaultLanguageSkill:
        noValue: true
  settingsErrorHandling:
    errorHandling:
      disconnect:
        none: true
  states:
    - state:
        name: Initial State
        refId: Initial State_10
        actions:
          - transferToAcd:
              name: Transfer to digital queue
              targetQueue:
                lit:
                  name: "{{queue_digital_messaging}}"
              priority:
                lit: 0
              preferredAgents:
                noValue: true
              languageSkill:
                noValue: true
              skills:
                noValue: true
